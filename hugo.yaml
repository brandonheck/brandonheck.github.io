      Experienced Software Engineer with 17+ years simplifying the developer experience, delivering highly scalable and performant distributed systems, cloud-native microservices, and enterprise data platforms. Proven track record across healthcare IT, retail, fintech, and payments.

      Delivering reliable backend services and platforms on GCP and AWS, and implementing standardized service contracts and event-driven architecture. Experienced technical lead, architect, and mentor with a strong background in cloud infrastructure, IaC, and cross-functional collaboration — with a focus on delivering reliable backend services that improve member experiences and operational excellence.
