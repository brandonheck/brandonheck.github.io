  # Experience
  experience:
    enable: true
    items:
      - company: "Hy-Vee"
        jobs:
          - name: "Sr. Software Engineer"
            date: "Apr 2024 - Present"
            content: |-
              - Build and maintain data extraction pipelines on GCP using Java, Cloud Functions, BigQuery, Dataform, and other GCP infrastructure
              - Orchestrate ETL workflows and implement data quality checks to ensure reliable, timely data delivery
              - Develop infrastructure monitoring and alerting tools to detect and surface execution deviations
              - Create microservices to serve business-relevant aggregate data
              - Manage cloud infrastructure as code (Terraform) across data platform services

      - company: "Marqeta"
        jobs:
          - name: "Sr. Software Engineer"
            date: "Nov 2021 - Mar 2024"
            content: |-
              - Designed and implemented a multi-stage data ingestion pipeline using AWS native services, handling batch file parsing of disparate encodings and enriching data with correlated internal system records
              - Composed transaction-level views and standardized output into structured, random-access Apache Parquet files
              - Leveraged AWS Lambda, Step Functions, Batch, EventBridge, S3, SNS, and SQS to automate workflow; managed infrastructure with Terraform
              - Developed core application logic in Java, deploying multiple stages within Docker containers
              - Enhanced the Transaction Reconciliation service by storing financial transaction data, automating discrepancy reconciliation between system records and partner data, and generating detailed mismatch reports
              - Acted as security champion, monitoring vulnerability scans and prioritizing/resolving issues to strengthen system security
              - Served as privacy champion and liaison to Privacy and Compliance teams, ensuring product compliance with PCI-DSS and company privacy standards

      - company: "Cerner Corporation"
        companyUrl: "https://www.cerner.com"
        jobs:
          - name: "Software Engineer IV"
            date: "Feb 2019 - Nov 2021"
            content: |-
              - Led as subject matter expert for the Java service development platform on Millennium, enhancing middleware and operational tooling to standardize system integration across the flagship product suite
              - Developed and improved platform libraries covering service discovery, reliability, operational tooling, resilience, data serialization, message broker interaction, IOC/dependency injection, database config, caching, ORM, and logging abstraction
              - Delivered design guidance via sessions, knowledge transfers, meetups, wiki docs, sample projects, and Javadoc to streamline developer adoption for Millennium services
              - Validated integration of the Millennium platform with new OS, JRE, Java Enterprise, middleware brokers, and APM versions using automated regression, integration, and manual testing in isolated environments
              - Implemented and maintained Maven and Eclipse IDE plugins to accelerate creation and maintenance of Millennium services
              - Integrated Java enterprise runtime with a containerized platform, enabling migration of dozens of existing services to SaaS
              - Served as platform security champion, reviewing vulnerabilities, managing notifications, logging POA&Ms, and coordinating remediations in a FedRAMP environment
              - Mentored 8 developers, conducted code reviews, and led monthly knowledge transfers and demos to boost team capability
              - Advised on standardizing build and release pipelines for Java artifacts, leveraging Maven and Jenkins for improved CI/CD efficiency
          - name: "Sr. Software Engineer"
            date: "May 2008 - Nov 2018"
            content: |-
              - Led a major uplift of Java enterprise platform APIs to utilize functions and generics, reducing developer configuration and environment skew with annotation-based design-time configuration
              - Enhanced platform integration with popular observability tools, enabling near-real-time monitoring of Java services across diverse client production environments
              - Designed and executed performance tests; established enterprise-wide standards for Java service performance tuning
              - Supported production operations by diagnosing performance issues and coordinating fixes between application development teams
              - Collaborated with vendors to resolve integration issues discovered during testing
              - Directed evolution of the team's continuous integration system into a robust integration and release management pipeline; defined reusable patterns for all Java development company-wide
              - Served as subject matter expert for the Java enterprise platform
              - Developed WebSphere Application Server tooling to simplify web app deployment by integrating discoverability and removing manual configuration
              - Owned and enhanced enterprise platform libraries standardizing integrations with tooling and middleware
              - Created testing libraries to autowire test environments for black box testing
              - Improved integration with WebSphere MQ message queueing to enable cross-application traceability
              - Built Java services to serve and persist clinical data for scheduling, insurance authorization, and demographics
              - Developed a playground web application for an in-house OAuth provider using Java JSP and Selenium

      - company: "PayIt"
        jobs:
          - name: "Senior Software Engineer"
            date: "Nov 2018 - Feb 2019"
            content: |-
              - Built Java REST microservices and a Clojure-based finite state machine for customer workflow automation
              - Integrated with client data systems; transformed and loaded customer data models into MongoDB
              - Enhanced a Node.js ES6 service for data transformation and display

